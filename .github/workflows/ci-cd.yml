name: CI/CD

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Конфигурация сервера
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка docker-compose
        run: |
          SERIQ_DOMAIN=example.com docker compose config -q
          SERIQ_DOMAIN=example.com docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q
      - name: Проверка Caddyfile
        run: docker run --rm -v "$PWD/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Проверка deploy.sh
        run: shellcheck infrastructure/scripts/*.sh

  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('backend/requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Тесты бэкенда
        if: hashFiles('backend/requirements.txt') != ''
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  engine:
    name: AI-движок
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('ai-engine/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты движка
        if: hashFiles('ai-engine/pyproject.toml') != ''
        run: |
          pip install ./ai-engine pytest
          if [ -d ai-engine/tests ]; then pytest -q ai-engine/tests; fi

  web:
    name: Сайт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Требования к сайту для Docker-образа
        if: hashFiles('apps/web/package.json') != ''
        run: |
          test -f apps/web/package-lock.json || { echo "::error::apps/web/package-lock.json не закоммичен"; exit 1; }
          grep -qE "output:\s*[\"']standalone[\"']" apps/web/next.config.* || { echo "::error::в next.config нужен output: \"standalone\""; exit 1; }
      - if: hashFiles('apps/web/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Линтер, тесты и сборка сайта
        if: hashFiles('apps/web/package-lock.json') != ''
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  mobile:
    name: Мобильное приложение
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('apps/mobile/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Анализ и тесты Flutter
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          if [ -d test ]; then flutter test; fi

  stack:
    name: Сборка и связка сервисов
    runs-on: ubuntu-latest
    env:
      SERIQ_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и запуск всех сервисов, что есть в коде
        run: |
          mkdir -p ai-engine models
          services="caddy"
          [ -f backend/requirements.txt ] && services="$services backend"
          [ -f apps/web/package.json ] && services="$services web"
          echo "сервисы: $services"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait --wait-timeout 300 $services
      - name: Сайт и API отвечают через Caddy
        run: |
          curl -fsS -o /dev/null http://localhost:8080/
          if [ -f backend/requirements.txt ]; then
            curl -fsS http://localhost:8080/api/v1/health | tee /dev/stderr | jq -e '.status == "ok"'
          fi
      - name: Логи при ошибке
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=80

  deploy:
    name: Деплой на сервер
    needs: [check, backend, engine, web, mobile, stack]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Настройка SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Деплой на сервер
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          : "${DEPLOY_HOST:?секрет DEPLOY_HOST не задан}" "${DEPLOY_USER:?секрет DEPLOY_USER не задан}"
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $GITHUB_SHA" < infrastructure/scripts/deploy.sh
      - name: Проверка сайта снаружи
        run: |
          domain=$(grep -E '^SERIQ_DOMAIN=' .env.example | cut -d= -f2-)
          curl -fsS -o /dev/null --retry 12 --retry-delay 5 --retry-all-errors "https://$domain/"
          if [ -f backend/requirements.txt ]; then
            curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "https://$domain/api/v1/health" | tee /dev/stderr | jq -e '.status == "ok"'
          fi
